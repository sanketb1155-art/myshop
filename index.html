<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Contractor Manager Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .card:hover { transform: translateY(-4px); }
    .modal { animation: modalPop 0.3s ease-out; }
    @keyframes modalPop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .toast { animation: toastIn 0.3s ease-out forwards; }
    @keyframes toastIn { from { transform: translate(-50%, 100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    .bottom-nav { box-shadow: 0 -4px 10px rgba(0,0,0,0.3); }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen pb-20">
  <div class="max-w-md mx-auto">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
      <div class="px-4 py-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold text-blue-400 flex items-center gap-2">
          <i class="fas fa-hard-hat"></i> Contractor Pro
        </h1>
        <div class="text-xs text-gray-400">v1.0</div>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="p-4"></main>
  </div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 max-w-md mx-auto">
    <div class="flex justify-around py-2">
      <button onclick="navigateTo(0)" class="nav-btn flex flex-col items-center text-gray-400 hover:text-blue-400 active">
        <i class="fas fa-home text-xl"></i><span class="text-xs mt-1">Dashboard</span>
      </button>
      <button onclick="navigateTo(1)" class="nav-btn flex flex-col items-center text-gray-400 hover:text-blue-400">
        <i class="fas fa-users text-xl"></i><span class="text-xs mt-1">Workers</span>
      </button>
      <button onclick="navigateTo(2)" class="nav-btn flex flex-col items-center text-gray-400 hover:text-blue-400">
        <i class="fas fa-plus-circle text-3xl -mt-2 text-blue-400"></i>
      </button>
      <button onclick="navigateTo(3)" class="nav-btn flex flex-col items-center text-gray-400 hover:text-blue-400">
        <i class="fas fa-list text-xl"></i><span class="text-xs mt-1">Records</span>
      </button>
      <button onclick="navigateTo(4)" class="nav-btn flex flex-col items-center text-gray-400 hover:text-blue-400">
        <i class="fas fa-chart-bar text-xl"></i><span class="text-xs mt-1">Reports</span>
      </button>
    </div>
  </nav>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 bg-gray-800 border border-gray-700 rounded-2xl px-6 py-3 shadow-2xl flex items-center gap-3 toast"></div>

  <!-- Modals -->
  <div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-end justify-center z-50">
    <div id="modal-content" class="bg-gray-900 w-full max-w-md rounded-t-3xl p-6 modal"></div>
  </div>

  <script>
    // ============== DATA MANAGEMENT ==============
    let workers = JSON.parse(localStorage.getItem('workers')) || [];
    let advances = JSON.parse(localStorage.getItem('advances')) || [];

    function saveData() {
      localStorage.setItem('workers', JSON.stringify(workers));
      localStorage.setItem('advances', JSON.stringify(advances));
    }

    // ============== UTILITIES ==============
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.innerHTML = `
        ${type === 'success' ? '<i class="fas fa-check-circle text-green-500"></i>' : '<i class="fas fa-exclamation-circle text-red-500"></i>'}
        <span>${msg}</span>
      `;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2800);
    }

    function buttonLoading(btn, text = 'Saving...') {
      const orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${text}`;
      return () => {
        btn.disabled = false;
        btn.innerHTML = orig;
      };
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function generateId() {
      return 'id_' + Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    // ============== NAVIGATION ==============
    let currentPage = 0;
    function navigateTo(page) {
      currentPage = page;
      document.querySelectorAll('.nav-btn').forEach((b, i) => {
        b.classList.toggle('text-blue-400', i === page);
        b.classList.toggle('text-gray-400', i !== page);
      });
      renderPage();
    }

    function renderPage() {
      const content = document.getElementById('main-content');
      if (currentPage === 0) renderDashboard(content);
      else if (currentPage === 1) renderWorkers(content);
      else if (currentPage === 2) showAddAdvanceModal();
      else if (currentPage === 3) renderRecords(content);
      else if (currentPage === 4) renderReports(content);
    }

    // ============== DASHBOARD ==============
    function renderDashboard(container) {
      const totalWorkers = workers.length;
      const totalAdvance = advances.reduce((sum, a) => sum + Number(a.amount), 0);
      
      const today = new Date().toISOString().split('T')[0];
      const todayAdvance = advances.filter(a => a.date === today).reduce((sum, a) => sum + Number(a.amount), 0);

      const monthStart = new Date().toISOString().slice(0, 7);
      const monthAdvance = advances.filter(a => a.date.startsWith(monthStart)).reduce((sum, a) => sum + Number(a.amount), 0);

      container.innerHTML = `
        <div class="space-y-6">
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-gray-900 rounded-2xl p-5 card">
              <p class="text-gray-400 text-sm">Total Workers</p>
              <p class="text-4xl font-bold text-blue-400 mt-2">${totalWorkers}</p>
            </div>
            <div class="bg-gray-900 rounded-2xl p-5 card">
              <p class="text-gray-400 text-sm">Today's Advance</p>
              <p class="text-4xl font-bold text-green-400 mt-2">₹${todayAdvance}</p>
            </div>
            <div class="bg-gray-900 rounded-2xl p-5 card">
              <p class="text-gray-400 text-sm">This Month</p>
              <p class="text-4xl font-bold text-yellow-400 mt-2">₹${monthAdvance}</p>
            </div>
            <div class="bg-gray-900 rounded-2xl p-5 card">
              <p class="text-gray-400 text-sm">Total Advance</p>
              <p class="text-4xl font-bold text-purple-400 mt-2">₹${totalAdvance}</p>
            </div>
          </div>

          <div class="bg-gray-900 rounded-2xl p-5">
            <h3 class="font-semibold mb-4 flex items-center gap-2"><i class="fas fa-clock"></i> Recent Transactions</h3>
            <div class="space-y-3 max-h-96 overflow-auto">
              ${advances.slice(0, 8).map(a => {
                const worker = workers.find(w => w.id === a.workerId);
                return `
                  <div class="flex justify-between items-center bg-gray-800 p-3 rounded-xl">
                    <div>
                      <p class="font-medium">${worker ? worker.name : 'Unknown'}</p>
                      <p class="text-xs text-gray-400">${formatDate(a.date)} • ${a.reason}</p>
                    </div>
                    <p class="font-bold text-red-400">- ₹${a.amount}</p>
                  </div>`;
              }).join('') || '<p class="text-gray-500 text-center py-8">No transactions yet</p>'}
            </div>
          </div>
        </div>
      `;
    }

    // ============== WORKERS ==============
    function renderWorkers(container) {
      container.innerHTML = `
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-bold">Workers</h2>
          <button onclick="showAddWorkerModal()" class="bg-blue-600 hover:bg-blue-700 px-5 py-2 rounded-2xl font-medium flex items-center gap-2">
            <i class="fas fa-plus"></i> Add
          </button>
        </div>
        <input id="worker-search" type="text" placeholder="Search by name or mobile..." 
               class="w-full bg-gray-900 border border-gray-700 rounded-2xl px-4 py-3 mb-4 focus:outline-none focus:border-blue-500"
               onkeyup="filterWorkers()">
        <div id="workers-list" class="space-y-4"></div>
      `;
      renderWorkersList();
    }

    function renderWorkersList(filteredWorkers = workers) {
      const container = document.getElementById('workers-list');
      container.innerHTML = filteredWorkers.map(w => {
        const totalAdv = advances.filter(a => a.workerId === w.id).reduce((sum, a) => sum + Number(a.amount), 0);
        const remaining = w.salary - totalAdv;
        return `
          <div class="bg-gray-900 rounded-3xl p-5 card">
            <div class="flex justify-between">
              <div>
                <p class="text-xl font-semibold">${w.name}</p>
                <p class="text-gray-400">${w.mobile}</p>
              </div>
              <div class="text-right">
                <p class="text-sm text-gray-400">Salary</p>
                <p class="font-bold">₹${w.salary}</p>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4 mt-6 text-sm">
              <div>
                <p class="text-gray-400">Advance Taken</p>
                <p class="font-semibold text-red-400">₹${totalAdv}</p>
              </div>
              <div>
                <p class="text-gray-400">Remaining</p>
                <p class="font-semibold \( {remaining >= 0 ? 'text-green-400' : 'text-red-400'}">₹ \){remaining}</p>
              </div>
            </div>
            <div class="flex gap-2 mt-6">
              <button onclick="viewWorker('${w.id}')" class="flex-1 bg-gray-800 hover:bg-gray-700 py-3 rounded-2xl">View</button>
              <button onclick="editWorker('${w.id}')" class="flex-1 bg-gray-800 hover:bg-gray-700 py-3 rounded-2xl">Edit</button>
              <button onclick="deleteWorker('${w.id}')" class="flex-1 bg-red-900 hover:bg-red-800 py-3 rounded-2xl text-red-400">Delete</button>
            </div>
          </div>`;
      }).join('');
    }

    function filterWorkers() {
      const term = document.getElementById('worker-search').value.toLowerCase();
      const filtered = workers.filter(w => 
        w.name.toLowerCase().includes(term) || w.mobile.includes(term)
      );
      renderWorkersList(filtered);
    }

    // ============== MODALS ==============
    function showModal(html) {
      document.getElementById('modal-content').innerHTML = html;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').onclick = (e) => {
        if (e.target === document.getElementById('modal')) closeModal();
      };
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    // Add Worker Modal
    function showAddWorkerModal(editId = null) {
      const worker = editId ? workers.find(w => w.id === editId) : null;
      showModal(`
        <h3 class="text-xl font-bold mb-6">${editId ? 'Edit Worker' : 'Add New Worker'}</h3>
        <input id="w-name" value="${worker ? worker.name : ''}" placeholder="Worker Name" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 mb-4"/>
        <input id="w-mobile" value="${worker ? worker.mobile : ''}" placeholder="Mobile Number" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 mb-4"/>
        <input id="w-salary" type="number" value="${worker ? worker.salary : ''}" placeholder="Monthly Salary (₹)" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 mb-4"/>
        <textarea id="w-notes" placeholder="Notes (optional)" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 h-24">${worker && worker.notes ? worker.notes : ''}</textarea>
        <div class="flex gap-3 mt-6">
          <button onclick="closeModal()" class="flex-1 py-4 rounded-2xl bg-gray-800">Cancel</button>
          <button onclick="saveWorker('${editId}')" class="flex-1 py-4 rounded-2xl bg-blue-600 hover:bg-blue-700 font-semibold">Save Worker</button>
        </div>
      `);
    }

    function saveWorker(editId) {
      const name = document.getElementById('w-name').value.trim();
      const mobile = document.getElementById('w-mobile').value.trim();
      const salary = parseFloat(document.getElementById('w-salary').value);

      if (!name || !mobile || !salary || salary <= 0) {
        showToast("Please fill all fields correctly", "error");
        return;
      }

      if (editId) {
        const w = workers.find(x => x.id === editId);
        if (w) {
          w.name = name; w.mobile = mobile; w.salary = salary; w.notes = document.getElementById('w-notes').value;
        }
      } else {
        workers.push({
          id: generateId(),
          name, mobile, salary,
          notes: document.getElementById('w-notes').value,
          createdAt: new Date().toISOString()
        });
      }
      saveData();
      closeModal();
      showToast(editId ? "Worker Updated" : "✅ Worker Added Successfully");
      renderPage();
    }

    function editWorker(id) { showAddWorkerModal(id); }

    function deleteWorker(id) {
      if (confirm("Delete this worker and all their records?")) {
        workers = workers.filter(w => w.id !== id);
        advances = advances.filter(a => a.workerId !== id);
        saveData();
        showToast("Worker Deleted");
        renderPage();
      }
    }

    // ============== ADVANCE ==============
    function showAddAdvanceModal() {
      let options = workers.map(w => `<option value="\( {w.id}"> \){w.name}</option>`).join('');
      showModal(`
        <h3 class="text-xl font-bold mb-6">New Advance Entry</h3>
        <select id="adv-worker" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 mb-4">
          <option value="">Select Worker</option>${options}
        </select>
        <input id="adv-amount" type="number" placeholder="Amount (₹)" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 mb-4"/>
        <input id="adv-date" type="date" value="${new Date().toISOString().split('T')[0]}" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 mb-4"/>
        <input id="adv-reason" placeholder="Reason (Ration, Medicine, etc.)" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 mb-4"/>
        <textarea id="adv-notes" placeholder="Notes" class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-4 py-3 h-24"></textarea>
        <div class="flex gap-3 mt-6">
          <button onclick="closeModal()" class="flex-1 py-4 rounded-2xl bg-gray-800">Cancel</button>
          <button onclick="saveAdvance()" class="flex-1 py-4 rounded-2xl bg-green-600 hover:bg-green-700 font-semibold">Save Advance</button>
        </div>
      `);
    }

    function saveAdvance() {
      const workerId = document.getElementById('adv-worker').value;
      const amount = parseFloat(document.getElementById('adv-amount').value);
      const date = document.getElementById('adv-date').value;
      const reason = document.getElementById('adv-reason').value.trim();

      if (!workerId || !amount || !date || !reason) {
        showToast("All fields are required", "error");
        return;
      }

      advances.unshift({
        id: generateId(),
        workerId,
        amount,
        date,
        reason,
        notes: document.getElementById('adv-notes').value.trim(),
        timestamp: new Date().toISOString()
      });

      saveData();
      closeModal();
      showToast("✅ Advance Saved Successfully");
      renderPage();
    }

    // ============== WORKER PROFILE ==============
    function viewWorker(id) {
      const worker = workers.find(w => w.id === id);
      if (!worker) return;

      const workerAdvances = advances.filter(a => a.workerId === id).sort((a,b) => b.date.localeCompare(a.date));
      const totalAdv = workerAdvances.reduce((sum, a) => sum + Number(a.amount), 0);
      const remaining = worker.salary - totalAdv;

      let html = `
        <div class="bg-gray-900 rounded-3xl p-6">
          <h2 class="text-2xl font-bold">${worker.name}</h2>
          <p class="text-gray-400">\( {worker.mobile} • Salary: ₹ \){worker.salary}</p>
          <div class="mt-6 grid grid-cols-2 gap-4">
            <div class="bg-gray-800 rounded-2xl p-4">
              <p class="text-sm text-gray-400">Total Advance</p>
              <p class="text-3xl font-bold text-red-400">₹${totalAdv}</p>
            </div>
            <div class="bg-gray-800 rounded-2xl p-4">
              <p class="text-sm text-gray-400">Payable Now</p>
              <p class="text-3xl font-bold \( {remaining >= 0 ? 'text-green-400' : 'text-red-400'}">₹ \){remaining}</p>
            </div>
          </div>
          <button onclick="settleSalary('${id}')" class="w-full mt-6 py-4 bg-emerald-600 hover:bg-emerald-700 rounded-2xl font-semibold">Settle Salary</button>
        </div>

        <h3 class="font-semibold mt-8 mb-4">Advance History</h3>
        <div class="space-y-4">
          ${workerAdvances.map(a => `
            <div class="bg-gray-900 rounded-2xl p-5">
              <div class="flex justify-between">
                <div>
                  <p class="font-medium">${formatDate(a.date)}</p>
                  <p class="text-sm text-gray-400">${a.reason}</p>
                </div>
                <div class="text-right">
                  <p class="font-bold text-red-400">- ₹${a.amount}</p>
                  \( {a.notes ? `<p class="text-xs text-gray-500"> \){a.notes}</p>` : ''}
                </div>
              </div>
              <div class="flex gap-2 mt-4">
                <button onclick="editAdvance('${a.id}')" class="flex-1 text-blue-400 text-sm">Edit</button>
                <button onclick="deleteAdvance('${a.id}')" class="flex-1 text-red-400 text-sm">Delete</button>
              </div>
            </div>
          `).join('') || '<p class="text-gray-500">No advances yet</p>'}
        </div>
      `;

      document.getElementById('main-content').innerHTML = html;
    }

    function settleSalary(id) {
      const worker = workers.find(w => w.id === id);
      if (!worker) return;
      const totalAdv = advances.filter(a => a.workerId === id).reduce((sum, a) => sum + Number(a.amount), 0);
      if (confirm(`Settle salary for \( {worker.name}?\nPayable: ₹ \){worker.salary - totalAdv}`)) {
        showToast(`✅ Salary of ₹${worker.salary - totalAdv} settled for ${worker.name}`);
      }
    }

    // ============== RECORDS ==============
    function renderRecords(container) {
      container.innerHTML = `
        <h2 class="text-2xl font-bold mb-4">All Records</h2>
        <input id="record-search" type="text" placeholder="Search records..." class="w-full bg-gray-900 border border-gray-700 rounded-2xl px-4 py-3 mb-4" onkeyup="filterRecords()">
        <div id="records-list" class="space-y-4"></div>
      `;
      renderRecordsList();
    }

    function renderRecordsList(filtered = advances) {
      const container = document.getElementById('records-list');
      container.innerHTML = filtered.map(a => {
        const worker = workers.find(w => w.id === a.workerId);
        return `
          <div class="bg-gray-900 rounded-3xl p-5 card">
            <div class="flex justify-between items-start">
              <div>
                <p class="font-semibold">${worker ? worker.name : 'Unknown'}</p>
                <p class="text-sm text-gray-400">${formatDate(a.date)}</p>
                <p class="text-sm">${a.reason}</p>
                \( {a.notes ? `<p class="text-xs text-gray-500 mt-1"> \){a.notes}</p>` : ''}
              </div>
              <div class="text-right">
                <p class="text-xl font-bold text-red-400">- ₹${a.amount}</p>
              </div>
            </div>
            <div class="flex gap-3 mt-5">
              <button onclick="editAdvance('${a.id}')" class="flex-1 py-3 rounded-2xl bg-gray-800 text-blue-400">Edit</button>
              <button onclick="deleteAdvance('${a.id}')" class="flex-1 py-3 rounded-2xl bg-gray-800 text-red-400">Delete</button>
            </div>
          </div>`;
      }).join('');
    }

    function filterRecords() {
      const term = document.getElementById('record-search').value.toLowerCase();
      const filtered = advances.filter(a => {
        const worker = workers.find(w => w.id === a.workerId);
        return (worker && worker.name.toLowerCase().includes(term)) || 
               a.reason.toLowerCase().includes(term);
      });
      renderRecordsList(filtered);
    }

    function editAdvance(id) {
      const adv = advances.find(a => a.id === id);
      if (!adv) return;
      // Simple prompt for demo completeness
      const newAmount = prompt("New Amount:", adv.amount);
      if (newAmount !== null) {
        adv.amount = parseFloat(newAmount);
        saveData();
        showToast("Entry Updated");
        renderPage();
      }
    }

    function deleteAdvance(id) {
      if (confirm("Delete this advance entry?")) {
        advances = advances.filter(a => a.id !== id);
        saveData();
        showToast("Entry Deleted");
        renderPage();
      }
    }

    // ============== REPORTS ==============
    function renderReports(container) {
      const totalAdv = advances.reduce((sum, a) => sum + Number(a.amount), 0);
      container.innerHTML = `
        <h2 class="text-2xl font-bold mb-6">Reports</h2>
        <div class="space-y-6">
          <div class="bg-gray-900 rounded-3xl p-6">
            <h3 class="font-semibold mb-4">Summary</h3>
            <p>Total Advance Given: <span class="font-bold text-2xl">₹${totalAdv}</span></p>
            <p class="text-sm text-gray-400 mt-2">Workers: ${workers.length} | Transactions: ${advances.length}</p>
          </div>
          <button onclick="exportJSON()" class="w-full py-4 bg-gray-800 hover:bg-gray-700 rounded-2xl">Export JSON</button>
          <button onclick="exportCSV()" class="w-full py-4 bg-gray-800 hover:bg-gray-700 rounded-2xl">Export CSV</button>
          <button onclick="showImportModal()" class="w-full py-4 bg-gray-800 hover:bg-gray-700 rounded-2xl">Import JSON</button>
        </div>
      `;
    }

    function exportJSON() {
      const data = { workers, advances, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `contractor_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      showToast("JSON Exported");
    }

    function exportCSV() {
      let csv = "Date,Worker,Amount,Reason,Notes\n";
      advances.forEach(a => {
        const worker = workers.find(w => w.id === a.workerId);
        csv += `"\( {a.date}"," \){worker ? worker.name : ''}",\( {a.amount}," \){a.reason}","${a.notes || ''}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `advances_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      showToast("CSV Exported");
    }

    function showImportModal() {
      showModal(`
        <h3 class="text-xl font-bold mb-6">Import Backup</h3>
        <input type="file" id="import-file" accept=".json" class="w-full bg-gray-800 border border-gray-700 rounded-2xl p-4"/>
        <div class="flex gap-3 mt-8">
          <button onclick="closeModal()" class="flex-1 py-4 bg-gray-800 rounded-2xl">Cancel</button>
          <button onclick="importData()" class="flex-1 py-4 bg-blue-600 rounded-2xl font-semibold">Import</button>
        </div>
      `);
    }

    function importData() {
      const fileInput = document.getElementById('import-file');
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data.workers && data.advances) {
            workers = data.workers;
            advances = data.advances;
            saveData();
            closeModal();
            showToast("✅ Data Imported Successfully");
            renderPage();
          }
        } catch(err) {
          showToast("Invalid file", "error");
        }
      };
      reader.readAsText(file);
    }

    // ============== START APP ==============
    window.onload = () => {
      navigateTo(0);
    };
  </script>
</body>
</html>
