<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mazdoor Advance Register Pro</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:#111827;
    color:#e5e7eb;
}

.container{
    padding-bottom:80px;
}

header{
    background:#1F2937;
    padding:15px;
    text-align:center;
}

.page{
    display:none;
    padding:10px;
}

.page.active{
    display:block;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.card{
    background:#1F2937;
    padding:15px;
    border-radius:10px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    width:100%;
    background:#1F2937;
    display:flex;
    justify-content:space-around;
    padding:10px 0;
}

.nav-item{
    cursor:pointer;
    text-align:center;
}

.nav-item.active{
    color:#22C55E;
}

.fab{
    background:#22C55E;
    color:black;
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:-30px;
}

.btn,
.btn-primary{
    width:100%;
    border:none;
    padding:12px;
    border-radius:8px;
    margin:10px 0;
    cursor:pointer;
}

.btn{
    background:#374151;
    color:white;
}

.btn-primary{
    background:#22C55E;
    color:black;
    font-weight:bold;
}

.btn-danger{
    background:#EF4444;
    color:white;
    border:none;
    padding:12px;
    border-radius:8px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #374151;
    background:#111827;
    color:white;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:#1F2937;
    padding:20px;
    border-radius:12px;
    width:90%;
    max-width:400px;
}

.transaction-item{
    background:#1F2937;
    padding:12px;
    border-radius:8px;
    margin:8px 0;
}
</style>

</head>
<body>

<!-- YAHAN TUMHARA PURA EXISTING BODY CODE RAHEGA -->

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script src="firebase.js"></script>
<script src="app.js"></script>

</body>
</html>
